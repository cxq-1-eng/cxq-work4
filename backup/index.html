<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css" class="css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
        <header>
            <h1>cxq的前端网页作品集</h1>
            <p>这是我的前端网页作品，点击跳转到具体的页面！</p>
        </header>
<div id="error-container" class="hidden">
    <p>No meals found. Try another search term!</p>
</div>

<div id="result-heading"></div>

<div id="meals" class="meals-container">
    <div class="meal" data-url="https://work2-teal.vercel.app/">
        <img src="./image/quiztime.png">
        <div class="meal-info">
            <h3 class="meal-title">Quiz Time</h3>
            <div class="meal-category">Quiz</div>
        </div>
    </div>

    <div class="meal" data-url="https://cxq-work1-1.vercel.app/">
        <img src="./image/register.png">
        <div class="meal-info">
            <h3 class="meal-title">Register Form</h3>
            <div class="meal-category">Register</div>
        </div>
    </div>

    <div class="meal" data-url="https://cxq-work2.vercel.app/">
        <img src="./image/recipe.png">
        <div class="meal-info">
            <h3 class="meal-title">Recipe Finder</h3>
            <div class="meal-category">Recipe</div>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
